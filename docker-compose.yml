services:
  moodle-405:
    env_file: .env
    build:
      context: .
      dockerfile: Dockerfile-405
      args:
        - app_port=${APP_405_PORT}
        - db_root_password=${DB_ROOT_PASSWORD}
    container_name: moodle-app-405
    links:
      - db
    depends_on:
      - db
    ports:
      - ${APP_405_PORT}:80
    volumes:
      - ./moodle-405:/var/www/html
      - ./moodledata-405:/var/www/moodledata-405:rw
      - ./docker/local.ini:/usr/local/etc/php/conf.d/local.ini
    restart: always

  moodle-500:
    env_file: .env
    build:
      context: .
      dockerfile: Dockerfile-500
      args:
        - app_port=${APP_500_PORT}
        - db_root_password=${DB_ROOT_PASSWORD}
    container_name: moodle-app-500
    links:
      - db
    depends_on:
      - db
    ports:
      - ${APP_500_PORT}:80
    volumes:
      - ./moodle-500:/var/www/html
      - ./moodledata-500:/var/www/moodledata-500:rw
      - ./docker/local.ini:/usr/local/etc/php/conf.d/local.ini
    restart: always

  db:
    image: mysql:8.4
    env_file: .env
    container_name: moodle-db
    ports:
      - ${MYSQL_PORT}:3306
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - ./db/sql:/docker-entrypoint-initdb.d/:ro
      - ./db/data:/var/lib/mysql
    restart: always