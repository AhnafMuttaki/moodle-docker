version: "3.7"
services:
  app:
    env_file: .env
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - app_port=${APP_PORT}
        - db_root_password=${DB_ROOT_PASSWORD}
    container_name: moodle-app
    links:
      - db
    depends_on:
      - db
    ports:
      - ${APP_PORT}:80
    volumes:
      - ./moodle:/var/www/html
      - ./moodledata:/var/www/moodledata:rw
      - ./docker/local.ini:/usr/local/etc/php/conf.d/local.ini
    restart: always

  db:
    image: mysql:8.4
    env_file: .env
    container_name: moodle-db
    ports:
      - ${MYSQL_PORT}:3306
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - ./db/sql:/docker-entrypoint-initdb.d/:ro
      - ./db/data:/var/lib/mysql
    restart: always