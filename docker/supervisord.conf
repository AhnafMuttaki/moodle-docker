[supervisord]
nodaemon=true

[program:php-fpm]
command=docker-php-entrypoint php-fpm
stdout_logfile=/var/log/php-fpm.log
stderr_logfile=/var/log/php-fpm_error.log
autorestart=true

[program:nginx]
command=/usr/sbin/nginx -g 'daemon off;'
stdout_logfile=/var/log/nginx.log
stderr_logfile=/var/log/nginx_error.log
autorestart=true

[program:cron]
command=/usr/sbin/cron -f
stdout_logfile=/var/log/cron.log
stderr_logfile=/var/log/cron_error.log
autorestart=true

[program:moodle-cron]
command=/usr/local/bin/php /var/www/html/admin/cli/cron.php
stdout_logfile=/var/www/html/moodle-cron.log
stderr_logfile=/var/www/html/moodle-error.log
autorestart=true